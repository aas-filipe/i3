[colors]
background = #00000000
bg-module = ${xrdb:color0:#282828}
background-alt = ${xrdb:color8:#3c3836}
foreground = ${xrdb:color15:#fbf1c7}
primary = ${xrdb:color2:#B8BB26}
secondary = ${xrdb:color4:#83A598}
alert = ${xrdb:color1:#fb4934}
disabled = ${xrdb:color8:#6272a4}
Purple = ${xrdb:color5:#d3869b}
Green = ${xrdb:color2:#689d69}
Cyan = ${xrdb:color6:#8ec07c}
Pink = ${xrdb:color3:#fabd2f}
Blue = ${xrdb:color4:#83a598}
orange = ${xrdb:color3:#fe8019}

[bar/main]
width = 100%
height = 20pt
radius = 12 
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 3pt
border-color = #00000000
padding-left = 0 padding-right = 0
module-margin = 0
separator = ""
separator-foreground = ${colors.disabled}
font-0 = "JetBrainsMono:size=10:weight=bold;2"
font-1 = "FontAwesome:size=10:weight=bold;2"
font-2 = "Ubuntu:size=10:weight=bold;2"
font-3 = "feather:size=10:weight=bold;2"
font-4 = "Iosevka:size=14:weight=bold;4"
font-5 = "Iosevka Nerd Font:size=15:weight=bold;4"

; Bar layout
modules-left = menu cap-right-cyan esp cap-left i3 cap-right
modules-center = cap-left date cap-right esp cap-left memory cpu p-dir cap-right
modules-right = cap-left tray cap-right esp cap-left pulseaudio battery cap-right esp cap-left powermenu 

enable-ipc = true

[module/tray]
type = internal/tray
format-background = ${colors.bg-module}
format-margin = 0pt
tray-background = ${colors.bg-module}
tray-spacing = 10pt


[module/i3]
type = internal/i3

; Focused workspace
label-focused = %index%
label-focused-foreground = ${colors.Purple}
label-focused-background = ${colors.bg-module}
label-focused-padding = 1

; Unfocused workspace
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-background = ${colors.bg-module}
label-unfocused-padding = 1

; Visible workspace (on another monitor, if any)
label-visible = %index%
label-visible-foreground = ${colors.Purple}
label-visible-background = ${colors.bg-module}
label-visible-padding = 1

; Urgent workspace
label-urgent = %index%
label-urgent-foreground = ${colors.Red}
label-urgent-background = ${colors.bg-module}
label-urgent-padding = 1

; Separator
label-separator = |
label-separator-foreground = ${colors.disabled}
label-separator-background = ${colors.bg-module}

[module/xwindow]
type = internal/xwindow
label = %title:0:10:...%

[module/memory]
type = internal/memory
interval = 20
format-background = ${colors.bg-module}
format-prefix = " "
format-prefix-foreground = ${colors.Blue}
label = %{F#d8dee9}%percentage_used%%
label-padding-left = 1
label-padding-right = 3

[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.bg-module}
format-prefix = ""
format-prefix-foreground = ${colors.Purple}
label = %{A1:kitty -e btop:}%{F#d8dee9}%percentage:2%%%{F-}%{A}
label-padding-left = 1
label-padding-right = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume-background = ${colors.bg-module}
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.orange}
format-volume = <label-volume>
label-volume = %{F#d8dee9}%percentage%%
label-muted = "  "
format-muted-background = ${colors.bg-module}
label-muted-foreground = ${colors.disabled}
label-padding-left = 1
label-padding-right = 3

[module/powermenu]
type = custom/script
format-background = ${colors.bg-module}
label-padding-left = 1
label-padding-right = 1
exec = echo "%{F#fbf1c7} ⏻%{F-}%{F#bd93f9}  %{F-}"
click-left = bash -c "$HOME/.config/rofi/powermenu/powermenu.sh"

[module/menu]
type = custom/script
format-background = ${colors.Cyan}
exec = echo "%{F#6272a4}  %{F-}%{F#16171d} "
click-left = bash -c "$HOME/.config/rofi/launch.sh"

[module/date]
type = internal/date
interval = 1
format-background = ${colors.bg-module}
date =  %a, %d-%b  |  %R
label = %{A1:gnome-calendar:}%date%%{A}
label-padding-left = 1
label-padding-right = 0

[module/battery]
type = custom/script
format-background = ${colors.bg-module}
exec = ~/.config/polybar/scripts/battery.sh
interval = 15
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl --min-value=10 set 5%-
label-padding-left = 1
label-padding-right = 1

[module/esp]
type = custom/text
content = "  "
content-foreground = ${colors.bg-module}
content-font = 2

[module/cap-left]
type = custom/text
content = ""
content-foreground = ${colors.bg-module}
content-background = #00000000
content-font = 6

[module/cap-right]
type = custom/text
content = ""
content-foreground = ${colors.bg-module}
content-background = #00000000
content-font = 6

[module/cap-left-cyan]
type = custom/text
content = ""
content-foreground = ${colors.Cyan}
content-background = #00000000
content-font = 6

[module/cap-right-cyan]
type = custom/text
content = ""
content-foreground = ${colors.Cyan}
content-background = #00000000
content-font = 6

;vim:ft=dosini
